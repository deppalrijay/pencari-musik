<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencari Musik</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="p-4 bg-light mb-4 shadow rounded">
            <h1 class="text-warning fw-bold">Selamat datang di Web Pencari Musik</h1>
            <p class="text-danger fw-bold mt-3 mb-2">Dengan menggunakan API itunes.com</p>
        </div>

        <form method="POST" class="input-group mb-5">
            <input type="text" name="pencarian" class="form-control" placeholder="Cari artist anda..." required>
            <button class="btn btn-success" type="submit">
                <i class="bi bi-search"></i>
            </button>
        </form>

        <div class="row">
            {% for song in lagu %}
            <div class="col-md-4 mb-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-truncate">{{song.trackName}}</h5>
                        <p class="card-text text-muted mb-2">Artis: {{song.artistName}}</p>
                        <p class="card-text"><small class="text-secondary">Album: {{song.collectionName}}</small></p>
                        {% if song.previewUrl %}
                        <audio controls class="w-100 mt-2">
                            <source src="{{song.previewUrl}}" type="audio/mp4">
                            Browser kamu tidak mendukung pemutar audio
                        </audio>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
